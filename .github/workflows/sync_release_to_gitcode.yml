name: Sync Release to GitCode

on:
  release:
    types: [published]  # 1. 触发条件：当GitHub Release被发布时

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync Release to GitCode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub自动提供的令牌
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }} # 2. 你刚才配置的GitCode令牌
          GITCODE_OWNER: "your-gitcode-username" # 3. 替换为你的GitCode用户名
          GITCODE_REPO: "your-gitcode-repo" # 4. 替换为你的GitCode仓库名
        run: |
          # 获取当前Release的Tag名称
          TAG_NAME=${{ github.event.release.tag_name }}
          
          # 从GitHub API获取当前Release的详细信息
          RELEASE_INFO=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG_NAME")
          
          RELEASE_NAME=$(echo "$RELEASE_INFO" | jq -r '.name')
          RELEASE_BODY=$(echo "$RELEASE_INFO" | jq -r '.body')
          
          # 5. 在GitCode上创建Release
          API_BASE="https://api.gitcode.com/api/v5"
          echo "正在GitCode上创建Release..."
          RELEASE_ID=$(curl -s -X POST \
            "$API_BASE/repos/$GITCODE_OWNER/$GITCODE_REPO/releases" \
            -H "Authorization: Bearer $GITCODE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"$TAG_NAME\",
              \"name\": \"$RELEASE_NAME\",
              \"body\": $(echo "$RELEASE_BODY" | jq -Rs .)
            }" | jq -r '.id')
          
          echo "GitCode Release创建成功，ID: $RELEASE_ID"
          
          # 6. 下载GitHub Release的附件并上传到GitCode
          ASSETS=$(echo "$RELEASE_INFO" | jq -r '.assets[].browser_download_url')
          for ASSET_URL in $ASSETS; do
            FILENAME=$(basename "$ASSET_URL")
            echo "正在下载并上传附件: $FILENAME"
            
            # 下载GitHub Release附件
            curl -L -o "$FILENAME" "$ASSET_URL"
            
            # 获取GitCode的上传地址
            UPLOAD_INFO=$(curl -s \
              -H "Authorization: Bearer $GITCODE_TOKEN" \
              "$API_BASE/repos/$GITCODE_OWNER/$GITCODE_REPO/releases/$TAG_NAME/upload_url?file_name=$FILENAME")
            
            UPLOAD_URL=$(echo "$UPLOAD_INFO" | jq -r '.url')
            # 上传文件到GitCode
            curl -X PUT "$UPLOAD_URL" \
              --data-binary "@$FILENAME" \
              -H "Content-Type: application/octet-stream"
            
            echo "附件 $FILENAME 上传完成"
          done